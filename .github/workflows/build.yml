name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o mediad-linux-amd64 .

      - name: Size check (<30MB)
        run: |
          size=$(stat -c%s mediad-linux-amd64)
          echo "binary size: $((size / 1024 / 1024)) MB"
          [ "$size" -le $((30 * 1024 * 1024)) ]

      - uses: actions/upload-artifact@v4
        with:
          name: mediad-linux-amd64
          path: mediad-linux-amd64

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mediad-linux-amd64
